services:
  - type: web
    name: forecast-agents
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_ENABLED
        value: "false"
      - key: FACTSAI_API_KEY
        sync: false
      - key: FACTSAI_ENABLED
        value: "false"
      - key: SERVER_API_KEY
        sync: false
